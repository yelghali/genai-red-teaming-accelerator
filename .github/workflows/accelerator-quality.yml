name: RTA quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,foundry]"
      - name: Validate Foundry configuration
        run: foundry-scan validate --config configs/foundry.yaml
      - name: Validate shared engine configuration
        run: |
          rta validate --config configs/redteam.yaml
          rta validate --config configs/examples/api-redteam.yaml
          rta validate --config configs/examples/ui-redteam.yaml
          rta plan baseline-pyrit --config configs/redteam.yaml --json
          rta plan baseline-foundry --config configs/redteam.yaml --json
          rta plan custom-pyrit --config configs/redteam.yaml --json
      - name: Check formatting
        run: python -m ruff format --check src tests configs/pyrit/initializer.py
      - name: Lint
        run: python -m ruff check src tests configs/pyrit/initializer.py
      - name: Run tests
        run: python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definition
        run: docker compose config
      - name: Build shared native runtime image
        run: docker compose build
      - name: Check native PyRIT entrypoint
        run: docker run --rm rta-redteam:local --help
      - name: Validate both engines in the container without execution
        run: |
          docker compose --profile tools run --rm redteam validate --config configs/redteam.yaml
          docker compose --profile tools run --rm redteam plan baseline-pyrit --config configs/redteam.yaml --json
          docker compose --profile tools run --rm redteam plan baseline-foundry --config configs/redteam.yaml --json
      - name: Start shared Co-PyRIT service
        env:
          REDTEAM_SCOPE_APPROVED: "true"
        run: docker compose up -d --wait co-pyrit
      - name: Check Co-PyRIT health
        run: curl --fail --silent --show-error http://127.0.0.1:8014/api/health
      - name: Stop Compose services
        if: always()
        run: docker compose down